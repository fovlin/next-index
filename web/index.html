<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{.Title}}</title>
<link rel="icon" href="/@next-index/assets/favicon.ico" sizes="any">
<link rel="icon" href="/@next-index/assets/favicon.svg" type="image/svg+xml">
<script>
	var theme=localStorage.getItem("next-index-theme");if(theme==="light"||theme==="dark"){document.documentElement.dataset.theme=theme;};
</script>
<link rel="stylesheet" href="/@next-index/assets/main.css">
</head>
<body>
<div class="app">
	<header class="topbar" id="topbar"></header>
	<main class="main" id="main">
	</main>
	<footer class="footer" id="footer"></footer>
</div>
<div class="toast-root" id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="application/json" id="next-index-bootstrap">{{.Bootstrap}}</script>
<script src="/@next-index/assets/app.js"></script>
</body>
</html>
